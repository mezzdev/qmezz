<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>Mezz</title>

  <script>
    const title = "Mezz";
    let position = 0;

    setInterval(() => {
      document.title =
        title.slice(position) + " • " + title.slice(0, position);

      position = (position + 1) % title.length;
    }, 200);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./assets/Mezz.png">
 
  <audio id="music" loop preload="auto">
    <source src="./assets/Brigest.mp3" type="audio/mpeg">
  </audio>
</head>

<body>

  <div class="noise"></div>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main class="page">

      <div class="avatar-wrap">

        <img
          src="./assets/Mezz.png"
          alt="Mezz"
          class="avatar"
        >
      </div>

      <div class="identity">
        <div class="name-row">
          <h1>Mezz</h1>
          <span class="verified" title="Verified">✓</span>
        </div>

        <p class="handle">@q.mezz</p>
      </div>

      <p class="bio">
        PYTHON - HTML - CSS - JS

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="./main.js"></script>
  <script src="./js/tracker.js"></script>

</html>
